[pytest]
pythonpath = .
asyncio_mode = strict
asyncio_default_fixture_loop_scope = function
# 탐색용·일회성 스크립트는 자동 수집에서 제외
norecursedirs = tests/scratch .venv .pytest_cache __pycache__
# live 마커: OLTA 인증 세션이 있어야만 실행되는 통합 테스트.
# CI 기본은 `-m "not live"`로 제외. 실행 시 `pytest -m live`.
markers =
    live: requires OLTA certificate / real network (not collected by default)
addopts = -m "not live"
