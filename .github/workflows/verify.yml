name: verify

on:
  pull_request:
    branches: [main, master]
  push:
    branches: [main, master]

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install frontend deps
        working-directory: frontend
        run: npm ci

      - name: Install backend deps
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff

      - name: Run shared verify.sh
        run: bash scripts/verify.sh

      - name: Structure check (strict)
        run: python scripts/structure-check.py --strict

      - name: Docs freshness
        run: python scripts/check-docs-freshness.py

      - name: Generated integrity
        run: python scripts/check-generated-integrity.py

      - name: Quality score (advisory)
        if: always()
        run: python scripts/quality-score.py --input-json '{}'
